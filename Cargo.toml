[package]
name = "terminos"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
drm = { version = "0.15", features = ["use_bindgen"] }
evdev = "0.13.2"
libseat = "0.2.4"
mio = { version = "1.2.5", features = ["os-ext", "os-poll"] }
rustix = { version = "1.0", features = ["fs"] }
